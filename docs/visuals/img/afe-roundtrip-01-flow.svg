<text x="60" y="835" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">Coins 15661, 16048, 15668 and 11471 of the AFE coin data (kept as sent). fw:hasConfidence and amt:weight are the same number here; the way back writes fw:UncertainResourceValue.</text>
