<text x="60" y="60" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="34" font-weight="500" fill="#1f1f1d">The same four cases as AFE container and as AMT statement</text>
<text x="60" y="112" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="22" font-weight="500" fill="#55544f">AFE container (Turtle, short)</text>
